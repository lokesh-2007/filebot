name: Windows unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Lint Rust core
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust core
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --locked

  rust-desktop:
    runs-on: windows-latest
    env:
      ORT_SKIP_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust desktop formatting
        run: cargo fmt --manifest-path rust/desktop/Cargo.toml -- --check
      - name: Lint Rust desktop
        run: cargo clippy --manifest-path rust/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Type-check Rust desktop
        run: cargo check --manifest-path rust/desktop/Cargo.toml --locked

  production-dependencies:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Import lazy runtime dependencies
        run: >-
          python -c "import bm25s, chromadb, docx, fastembed, fitz, nanobot, ollama, PyQt6, watchdog, yaml"
      - name: Verify the sleeping entry point does not load model libraries
        run: python -m unittest tests.test_startup -v
      - name: Verify Chroma persistent client shutdown
        run: |
          python -c "import tempfile; from pathlib import Path; import chromadb; d=tempfile.TemporaryDirectory(); client=chromadb.PersistentClient(path=d.name); client.get_or_create_collection('filebot_ci_smoke'); client.close(); d.cleanup(); print('Chroma client closed and temporary database removed')"

  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "PyYAML>=6,<7" "watchdog>=4,<7" "PyQt6>=6.6,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell setup and launch scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/start.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
