name: Windows unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "PyYAML>=6,<7" "watchdog>=4,<7" "PyQt6>=6.6,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell setup and launch scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/start.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }

