name: Windows unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Import lazy runtime dependencies
        run: >-
          python -c "import chromadb, docx, fastembed, fitz, PyQt6, watchdog, yaml"
      - name: Verify the sleeping entry point does not load model libraries
        run: python -m unittest tests.test_startup -v
      - name: Verify Chroma persistent client shutdown
        run: |
          python -c "import tempfile; from pathlib import Path; import chromadb; d=tempfile.TemporaryDirectory(); client=chromadb.PersistentClient(path=d.name); client.get_or_create_collection('filebot_ci_smoke'); client.close(); d.cleanup(); print('Chroma client closed and temporary database removed')"

  frozen-build:
    # Freezes the app (without the multi-GB models) and runs its built-in self-check.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build requirements
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Freeze with PyInstaller
        run: python -m PyInstaller packaging/filebot.spec --noconfirm --distpath dist --workpath build
      - name: Self-check the frozen build
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selfcheck.json"
          $p = Start-Process dist\FileBot\FileBot.exe -ArgumentList "--selfcheck","--selfcheck-out=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "Frozen self-check failed" }
      - name: Upload the model-less build
        uses: actions/upload-artifact@v4
        with:
          name: filebot-frozen-no-models
          path: dist/FileBot
          retention-days: 7

  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "PyYAML>=6,<7" "watchdog>=4,<7" "PyQt6>=6.6,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell setup and launch scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/start.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("packaging/build.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
