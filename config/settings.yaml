# FileBot configuration. Paths support ~ and environment-variable expansion.
app:
  name: FileBot
  database_path: "~/.filebot/filebot.sqlite3"
  log_level: INFO

index:
  roots:
    - "~/Documents"
  include_extensions:
    - .txt
    - .md
    - .pdf
    - .docx
  exclude_dirs:
    - .git
    - .venv
    - node_modules
  max_file_bytes: 52428800
  chunk_chars: 1200
  chunk_overlap: 150
  debounce_seconds: 1.0

models:
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: qwen2.5-coder:3b
    # Ollama accepts 0 to unload immediately or a duration such as 2m.
    keep_alive: "0"
  embeddings:
    model: BAAI/bge-small-en-v1.5
    cache_dir: "~/.cache/filebot/fastembed"
  vector_store:
    path: "~/.filebot/chromadb"

runtime:
  idle_unload_seconds: 120
  hotkey: "<ctrl>+<alt>+space"

