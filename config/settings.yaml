# FileBot configuration. Paths support ~ and environment-variable expansion.
app:
  name: FileBot
  database_path: "~/.filebot/filebot.sqlite3"
  log_level: INFO

index:
  roots:
    - "~/Documents"
  include_extensions:
    - .txt
    - .md
    - .pdf
    - .docx
    - .py
    - .pyi
    - .rs
    - .js
    - .jsx
    - .mjs
    - .cjs
    - .ts
    - .tsx
    - .go
    - .java
    - .c
    - .h
    - .cc
    - .cpp
    - .cxx
    - .hpp
    - .hh
    - .cs
    - .rb
    - .php
    - .sh
    - .bash
    - .ps1
    - .json
    - .yaml
    - .yml
    - .toml
    - .sql
  exclude_dirs:
    - .git
    - .venv
    - node_modules
  max_file_bytes: 52428800
  max_extracted_chars: 5000000
  max_docx_uncompressed_bytes: 100000000
  source_parse_timeout_ms: 250
  chunk_chars: 1200
  chunk_overlap: 150
  debounce_seconds: 1.0
  background_batch_size: 10
  background_poll_seconds: 1.0

# Optional search shorthand. For example, map "spec" to "product specification".
retrieval:
  glossary: {}

models:
  ollama:
    base_url: "http://127.0.0.1:11434"
    # Nanobot's Ollama provider uses the OpenAI-compatible endpoint.
    api_base: "http://127.0.0.1:11434/v1"
    model: qwen2.5-coder:3b
    # Start the lightweight server only when Ask is used; the model stays lazy.
    auto_start: true
    startup_timeout_seconds: 30
    # Keep the model warm between quick turns; the lifecycle manager sends 0 on sleep.
    keep_alive: "2m"
    # Bound context and generated tokens to control inference RAM and response latency.
    num_ctx: 4096
    num_predict: 256
  embeddings:
    model: BAAI/bge-small-en-v1.5
    cache_dir: "~/.cache/filebot/fastembed"
    batch_size: 16
  vector_store:
    path: "~/.filebot/chromadb"

runtime:
  idle_unload_seconds: 120
  request_timeout_seconds: 180
  hotkey: "<ctrl>+<alt>+<space>"
