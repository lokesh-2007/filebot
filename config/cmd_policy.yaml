# Default-deny policy. Read-only and gated commands both require a visible
# proposal and explicit approval in FileBot's UI before execution.
version: 1
default: blocked
read_only:
  # Entries are case-insensitive regular expressions matched against the full
  # command string. Keep this allowlist narrow.
  - '^\s*dir(?:\s|$).*$'
  - '^\s*where(?:\.exe)?\s+[^&|<>]+$'
  - '^\s*whoami(?:\.exe)?(?:\s+[^&|<>]+)?\s*$'
  - '^\s*systeminfo(?:\.exe)?\s*$'
  - '^\s*ipconfig(?:\.exe)?(?:\s+/all)?\s*$'
  - '^\s*tasklist(?:\.exe)?\s*$'
gated:
  # These are proposals only. FileBot still requires an explicit approval.
  - '^\s*mkdir(?:\.exe)?\s+.+$'
  - '^\s*rmdir(?:\.exe)?\s+.+$'
  - '^\s*copy(?:\.exe)?\s+.+$'
  - '^\s*move(?:\.exe)?\s+.+$'
  - '^\s*ren(?:ame)?(?:\.exe)?\s+.+$'
  - '^\s*del(?:ete)?(?:\.exe)?\s+.+$'
blocked:
  # Explicit blocks take precedence over the allowlists. These patterns guard
  # shell chaining, variable expansion, installers, privilege changes and disk tools.
  - '[&|<>]'
  - '[%!]'
  - '\b(?:format|diskpart|reg(?:\.exe)?\s+(?:add|delete|import)|shutdown|reboot|bcdedit|takeown|icacls|runas|powershell|pwsh|msiexec|winget|choco|scoop|pip|python\s+-m\s+pip)\b'
  - '^\s*(?:del|erase|rmdir|rd)(?:\.exe)?\s+.*(?:/s|/q|/f)'

